name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - run: npm exec --yes --package=yarn@1.22.22 -- yarn install --frozen-lockfile
      - run: npm exec --yes --package=yarn@1.22.22 -- yarn lint
      - run: npm exec --yes --package=yarn@1.22.22 -- yarn typecheck
      - run: python3 -B .trunk/configs/tests/test_trufflehog_to_sarif.py
      - run: npm exec --yes --package=yarn@1.22.22 -- yarn test --ci --runInBand
