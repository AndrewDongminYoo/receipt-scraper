# cspell:words iphonesimulator temurin
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - run: npm exec --yes --package=yarn@1.22.22 -- yarn install --frozen-lockfile
      - run: npm exec --yes --package=yarn@1.22.22 -- yarn lint
      - run: npm exec --yes --package=yarn@1.22.22 -- yarn typecheck
      - run: python3 -B .trunk/configs/tests/test_trufflehog_to_sarif.py
      - run: npm exec --yes --package=yarn@1.22.22 -- yarn test --ci --runInBand

  build-ios:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUNDLE_FROZEN: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - run: npm exec --yes --package=yarn@1.22.22 -- yarn install --frozen-lockfile
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: 3.4.1
          bundler: Gemfile.lock
      - run: bundle install
      - name: Install locked pods
        run: bundle exec pod install --project-directory=ios --deployment
      - name: Build Debug simulator app
        shell: bash
        run: |
          NODE_BINARY="$(command -v node)"
          export NODE_BINARY
          xcodebuild -version
          build_args=(
            -workspace ios/receiptScraper.xcworkspace
            -scheme receiptScraper
            -configuration Debug
            -destination 'generic/platform=iOS Simulator'
            -derivedDataPath "$RUNNER_TEMP/receipt-scraper-derived-data"
            CODE_SIGNING_ALLOWED=NO
          )
          xcodebuild "${build_args[@]}" build
          xcodebuild "${build_args[@]}" -showBuildSettings -json > "$RUNNER_TEMP/ios-build-settings.json"
      - name: Resolve simulator app
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          settings = json.loads((Path(os.environ['RUNNER_TEMP']) / 'ios-build-settings.json').read_text())
          targets = [item['buildSettings'] for item in settings if item['target'] == 'receiptScraper']
          assert len(targets) == 1, 'Expected exactly one receiptScraper target'
          target = targets[0]
          assert target['CONFIGURATION'] == 'Debug'
          assert target['PLATFORM_NAME'] == 'iphonesimulator'
          assert target['FULL_PRODUCT_NAME'] == 'receiptScraper.app'
          app = Path(target['TARGET_BUILD_DIR']) / target['FULL_PRODUCT_NAME']
          assert app.is_dir(), f'Missing simulator app: {app}'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'SIMULATOR_APP={app}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(f"iOS Debug simulator: `{app}`; SDK `{target['SDK_NAME']}`; architectures `{target['ARCHS']}`; commit `{os.environ['GITHUB_SHA']}`.\n")
          PY
      - name: Package simulator app and record SHA-256
        id: ios-package
        shell: bash
        run: |
          archive="$RUNNER_TEMP/receipt-scraper-ios-simulator-debug.tar.gz"
          tar -czf "$archive" -C "$(dirname "$SIMULATOR_APP")" "$(basename "$SIMULATOR_APP")"
          tar -tzf "$archive" > "$RUNNER_TEMP/ios-archive-contents.txt"
          test -s "$RUNNER_TEMP/ios-archive-contents.txt"
          shasum -a 256 "$archive" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "path=$archive" >> "$GITHUB_OUTPUT"
      - name: Upload simulator app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: receipt-scraper-ios-simulator-debug
          path: ${{ steps.ios-package.outputs.path }}
          if-no-files-found: error

  build-android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - run: npm exec --yes --package=yarn@1.22.22 -- yarn install --frozen-lockfile
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006
      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          NODE_BINARY="$(command -v node)"
          export NODE_BINARY
          ./gradlew :app:assembleDebug --no-daemon --console=plain
      - name: Resolve APK and record SHA-256
        id: android-artifact
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          directory = Path('android/app/build/outputs/apk/debug').resolve()
          metadata = json.loads((directory / 'output-metadata.json').read_text())
          assert metadata['variantName'] == 'debug'
          assert metadata['applicationId'] == 'com.receiptscraper'
          assert len(metadata['elements']) == 1, 'Expected exactly one Debug APK'
          element = metadata['elements'][0]
          assert not element['filters'], 'Expected a universal APK'
          apk = (directory / element['outputFile']).resolve()
          assert apk.parent == directory and apk.suffix == '.apk'
          assert apk.is_file(), f'Missing Debug APK: {apk}'
          digest = hashlib.file_digest(apk.open('rb'), 'sha256').hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'path={apk}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(f"Android Debug: `{apk}`; application ID `{metadata['applicationId']}`; version `{element['versionName']}` ({element['versionCode']}); commit `{os.environ['GITHUB_SHA']}`.\nSHA-256: `{digest}`.\n")
          print(f'{digest}  {apk}')
          PY
      - name: Upload Debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: receipt-scraper-android-debug
          path: ${{ steps.android-artifact.outputs.path }}
          if-no-files-found: error
