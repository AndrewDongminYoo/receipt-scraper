# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - java@13.0.11
    - node@22.23.4
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  ignore:
    - linters: [osv-scanner]
      paths: [ios/Podfile.lock]
    - linters: [shfmt, shellcheck]
      paths: [android/gradlew]
  disabled:
    - grype
  enabled:
    - actionlint@1.7.12
    - checkov@3.4.0
    - cspell@10.4.0
    - dotenv-linter@4.0.0
    - eslint@10.13.0
    - git-diff-check
    - ktlint@1.8.0
    - markdownlint@0.50.0
    - osv-scanner@2.7.0
    - oxipng@10.2.1
    - pinact@4.1.1!:
        commands: [lint, upgrade]
    - prettier@3.9.10
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - taplo@0.10.0
    - trufflehog@3.99.7
    - yamllint@1.38.0
  definitions:
    - name: pinact
      commands:
        - name: upgrade
          enabled: true
    - name: trufflehog
      commands:
        - name: lint
          run: trufflehog filesystem --json --fail --fail-on-scan-errors --no-verification --no-update ${target}
          direct_configs:
            - .trunk/configs/trufflehog_to_sarif.py
          parser:
            runtime: python
            run: python3 .trunk/configs/trufflehog_to_sarif.py
actions:
  definitions:
    - id: trunk-announce
      run: trunk show-announcements --monitor=false "${hook}" -- "${@}"
    - id: trunk-fmt-pre-commit
      run: trunk fmt --monitor=false -t "git-commit" --index-file '${env.GIT_INDEX_FILE}' --upstream=HEAD
    - id: trunk-check-pre-push
      run: trunk check --monitor=false -n -t git-push --commit-ref-from-pre-push '${hook_stdin_path}'
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
